<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Incidente del passo di Djatlov</title>
    <link rel="stylesheet" href="Esterno_Css.css">
    <link rel="icon" href="sciare.jpg" type="image/x-icon">
</head>
<body>
    <nav class="nav1" style="background-color: transparent;position: relative;"></nav>
    <h1 class="testo">Incidente del passo di Djatlov</h1>
    
    <div class="primo" style="height: 1000px;background:white">
        <nav class="nav1" id="sopra">
            <h1 style="color: white;position: relative;text-align: center;font-size: 60px;padding-top: 70px;">Contattaci</h1>
            <a href="../index.html"><img src="logo.png" class="immagine"></a>
            <table class="testo2">
                <tr>
                    <td style="width: 120px;"><a href="../index.html" class="link1" >Home</a></td>
                    <td style="width: 120px;"><a href="foglio2.html" class="link1" >storia</a></td>
                    <td style="width: 120px;"><a class="link1"  href="foglio3.html">Teorie</a></td>
                    <td><a href="foglio5.html" class="link1" >Sezione interattiva</a></td>
                </tr>
            </table>
        </nav>
        
        <!-- Form di contatto migliorato -->
        <div class="form-container" style="max-width: 600px; margin: 50px auto; padding: 30px; background-color: #f9f9f9; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
            <h2 style="text-align: center; color: #333; margin-bottom: 30px;">Inviaci un messaggio</h2>
            <form action="#" method="post">
                <div style="margin-bottom: 20px;">
                    <label for="nome" style="display: block; margin-bottom: 8px; font-weight: bold; color: #555; cursor: pointer;">Nome:</label>
                    <input type="text" id="nome" name="nome" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px;">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label for="email" style="display: block; margin-bottom: 8px; font-weight: bold; color: #555; cursor: pointer;">Email:</label>
                    <input type="email" id="email" name="email" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px;">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label for="oggetto" style="display: block; margin-bottom: 8px; font-weight: bold; color: #555; cursor: pointer;">Oggetto:</label>
                    <select id="oggetto" name="oggetto" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; cursor: pointer;">
                        <option value="informazioni">Informazioni</option>
                        <option value="teorie">Nuove teorie</option>
                        <option value="collaborazione">Collaborazione</option>
                        <option value="altro">Altro</option>
                    </select>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label for="messaggio" style="display: block; margin-bottom: 8px; font-weight: bold; color: #555; cursor: pointer;">Messaggio:</label>
                    <textarea id="messaggio" name="messaggio" rows="5" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; resize: vertical; cursor: text;"></textarea>
                </div>
                
                <div style="margin-bottom: 25px;">
                    <input type="checkbox" id="privacy" name="privacy" required style="cursor: pointer;">
                    <label for="privacy" style="color: #555; cursor: pointer; margin-left: 5px;">Accetto l'informativa sulla privacy</label>
                </div>
                
                <button type="submit" style="background-color: #333; color: white; padding: 12px 25px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; transition: background-color 0.3s ease;">Invia messaggio</button>
            </form>
        </div>
    </div>
    
    <footer style="background-color: black; position: absolute; width: 100%; height: 135px; left: 0%;">
        <h5>Il mistero del passo di Djatlov</h5>
        <h5 style="position: absolute; bottom: 35px; color: #F5E1C0;">© 2025 Djatlov Mystery. Tutti i diritti riservati.</h5>
        <h5 style="position: absolute; bottom: 5px; color: #F5E1C0;">Seguici sui social: <span style="color:#FFD700;">Instagram | Facebook | TikTok</span></h5>
    </footer>
</body>
</html>
